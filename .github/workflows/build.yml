name: firmware-and-tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.6.0'
      - run: python -m pip install pyserial reedsolo bitstring ecdsa
      - run: python tools/test.py
      - run: python tools/prepare_sounds.py
      - run: python tools/build.py --install --profile all
      # Sem publicacao de amostras/binarios de terceiros pelo workflow.
